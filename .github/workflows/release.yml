name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z release tag to repair/publish; leave empty to update the release PR
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.sha }}

  release-please:
    needs: verify
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publish:
    needs: [verify, release-please]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Validate tag syntax
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected an existing stable vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify the exact tagged source
        run: npm run check
      - name: Build release ZIP and checksum
        run: npm run package:extension
      - name: Upload verified assets, then publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Require a release created by Release Please; do not invent releases for arbitrary refs.
          gh release view "$RELEASE_TAG" --json tagName --jq .tagName
          gh release upload "$RELEASE_TAG" "release/pi-x-${RELEASE_TAG}.zip" release/SHA256SUMS.txt --clobber
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.md
          if ! grep -q '<!-- pi-x-install -->' release-notes.md; then
            cat >> release-notes.md <<'INSTALL'

          <!-- pi-x-install -->
          ## Install in Chrome

          1. Download `pi-x-vX.Y.Z.zip` below (not the source code archive).
          2. Extract it into a permanent folder.
          3. Open `chrome://extensions` and enable **Developer mode**.
          4. Click **Load unpacked** and select the folder containing `manifest.json`.
          5. Open pi-x → **Settings**, connect your model, and click **Test connection**.

          To update, replace the files in the same folder and click **Reload** in Chrome.
          See the repository README for usage and `INSTALL.md` in the ZIP for details.
          INSTALL
          fi
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false
          echo "Download: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
