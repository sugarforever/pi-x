name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and release source
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected an existing stable vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          fi
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          node scripts/check-version.mjs "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Validate tag syntax
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected an existing stable vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify the exact tagged source
        run: env -u RELEASE_TAG npm run check
      - name: Build release ZIP and checksum
        run: npm run package:extension
      - name: Upload verified assets, then publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "pi-x $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "release/pi-x-${RELEASE_TAG}.zip" release/SHA256SUMS.txt --clobber
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.md
          if ! grep -q '<!-- pi-x-install -->' release-notes.md; then
            cat >> release-notes.md <<'INSTALL'

          <!-- pi-x-install -->
          ## Install in Chrome

          1. Download `pi-x-vX.Y.Z.zip` below (not the source code archive).
          2. Extract it into a permanent folder.
          3. Open `chrome://extensions` and enable **Developer mode**.
          4. Click **Load unpacked** and select the folder containing `manifest.json`.
          5. Open pi-x → **Settings**, connect your model, and click **Test connection**.

          To update, replace the files in the same folder and click **Reload** in Chrome.
          See the repository README for usage and `INSTALL.md` in the ZIP for details.
          INSTALL
          fi
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false
          echo "Download: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
